<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JustClarify — History</title>
    <link rel="stylesheet" href="history.css" />
  </head>
  <body>
    <header class="jc-hist-header">
      <div class="jc-hist-inner">
        <div class="jc-pop-brand">
          <span class="jc-pop-mark" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="4.5" y="4.5" width="15" height="15" rx="3.8" transform="rotate(45 12 12)" fill="currentColor"/>
              <rect x="8.5" y="8.5" width="7" height="7" rx="1.8" transform="rotate(45 12 12)" fill="var(--jc-bg, #fbf9f7)"/>
            </svg>
          </span>
          <div class="jc-pop-titles">
            <span class="jc-pop-title">JustClarify</span>
            <span class="jc-pop-sub">Conversations &amp; what changed on the page</span>
          </div>
        </div>
      </div>
    </header>

    <main id="jc-pop-list" class="jc-pop-list" aria-live="polite"></main>

    <script src="brand.js"></script>
    <script src="history.js"></script>
  </body>
</html>
